# Local version of the whole stack:
#   docker compose up -d db
#   docker compose run --rm pipeline python ingest/load_pbp.py --start 2010
#   docker compose run --rm pipeline sh -c 'export $(python scripts/pg_env.py | xargs) && cd dbt && dbt build --profiles-dir .'
#   docker compose up dashboard      -> http://localhost:8501
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nfl
      POSTGRES_PASSWORD: nfl
      POSTGRES_DB: nfl
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nfl"]
      interval: 5s
      retries: 10

  pipeline:
    build: .
    environment:
      DATABASE_URL: postgresql://nfl:nfl@db:5432/nfl
    depends_on:
      db: {condition: service_healthy}
    profiles: [tools]

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      DATABASE_URL: postgresql://nfl:nfl@db:5432/nfl
    ports: ["8501:8501"]
    depends_on:
      db: {condition: service_healthy}

volumes:
  pgdata:
