version: 2

sources:
  - name: raw
    schema: raw
    description: Play-by-play data loaded from nflverse by ingest/load_pbp.py
    tables:
      - name: pbp
        description: One row per play, 2010 through the current season. Partitioned by season on BigQuery.
        columns:
          - name: game_id
            tests: [not_null]
          - name: play_id
            tests: [not_null]
          - name: season
            tests: [not_null]
      - name: load_log
        description: When each season was last refreshed.
